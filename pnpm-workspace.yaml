# Install scripts pnpm may run. All off: each of these packages ships prebuilt
# binaries, and the scripts only rebuild or re-check them. An unanswered entry
# makes `pnpm install --frozen-lockfile` fail, which would fail a Vercel deploy.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: false
  sharp: false
  unrs-resolver: false
dangerouslyAllowAllBuilds: false
